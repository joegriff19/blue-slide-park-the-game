<style>
*{box-sizing:border-box;margin:0;padding:0}
.page-wrap{width:100%;padding:24px 24px 48px 24px;display:flex;justify-content:center;align-items:flex-start}
.game-sizer{
  width: min(98vw, calc(75vh * 17 / 10));
  min-width: min(98vw, calc(75vh * 17 / 10));
  aspect-ratio: 17/10;
  max-width: 100%;
}
#gw{position:relative;width:100%;height:100%;overflow:hidden;font-family:'Arial Black',Arial,sans-serif;cursor:default;user-select:none;font-style:italic;background:#000;container-type:size}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}

#score-box{position:absolute;bottom:3%;left:2.3%;z-index:5}
#score-label{font-size:2.5cqi;font-weight:900;color:#fff;-webkit-text-stroke:0.38cqi #000;letter-spacing:0.2cqi;font-style:italic}

#player-name-display{position:absolute;top:3%;left:2.3%;font-size:2.5cqi;font-weight:900;color:#fff;-webkit-text-stroke:0.29cqi #000;letter-spacing:0.2cqi;z-index:5;font-style:italic;white-space:nowrap}
button#new-user-btn{position:absolute !important;top:2.5% !important;right:2% !important;z-index:20 !important;pointer-events:all !important;background-color:#e8b020 !important;background-image:none !important;border:0.58cqi solid #000 !important;border-radius:1.5cqi !important;padding:1.15cqi 2.3cqi !important;font-family:'Arial Black',Arial,sans-serif !important;font-weight:900 !important;font-style:italic !important;font-size:2.5cqi !important;color:#fff !important;-webkit-text-stroke:0.29cqi #000 !important;letter-spacing:0.2cqi !important;cursor:pointer !important;box-shadow:0.38cqi 0.38cqi 0 rgba(0,0,0,0.3) !important;transition:transform 0.1s, background-color 0.1s !important;appearance:none !important;-webkit-appearance:none !important}
button#new-user-btn:hover{transform:translate(-1px,-1px) !important;box-shadow:0.58cqi 0.58cqi 0 rgba(0,0,0,0.3) !important;background-color:#888888 !important}
button#new-user-btn:active{transform:translate(1px,1px) !important;box-shadow:0.19cqi 0.19cqi 0 rgba(0,0,0,0.3) !important}
#overlay{position:absolute;inset:0;pointer-events:all;z-index:10;font-style:italic}
#go-title{position:absolute;top:15%;left:0;right:0;font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-weight:900;color:#fff;-webkit-text-stroke:0.96cqi #000;text-align:center;font-size:9.2cqi;letter-spacing:0.58cqi;line-height:1;white-space:nowrap;padding:0 2%}
#go-title.long{font-size:6.5cqi;-webkit-text-stroke:0.77cqi #000;letter-spacing:0.4cqi;top:18%}
#go-score{position:absolute;top:35%;left:2.7%;font-family:'Arial Black',Arial,sans-serif;font-style:italic;color:#fff;-webkit-text-stroke:0.58cqi #000;text-align:left}
#go-score .label{font-size:5cqi;font-weight:900;letter-spacing:0.38cqi;line-height:1.05}
#go-score .num{font-size:11cqi;font-weight:900;-webkit-text-stroke:0.96cqi #000;line-height:1;margin-top:0.8cqi}
#go-score .best{font-size:4.2cqi;font-weight:900;letter-spacing:0.2cqi;line-height:1.2;margin-top:2.3cqi;-webkit-text-stroke:0.48cqi #000}
#go-score .best-num{font-size:4.2cqi;font-weight:900;letter-spacing:0.2cqi;line-height:1.2;margin-top:0.38cqi;-webkit-text-stroke:0.48cqi #000}
#leaderboard{position:absolute;top:32%;right:2%;width:52%;background:#fff;border:0.48cqi solid #000;border-radius:1.5cqi;padding:1.5cqi 1.9cqi;box-shadow:0.38cqi 0.38cqi 0 rgba(0,0,0,0.3);font-style:italic}
#leaderboard-title{font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-weight:900;font-size:2.7cqi;letter-spacing:0.38cqi;color:#000;margin-bottom:0.8cqi;border-bottom:0.29cqi solid #000;padding-bottom:0.38cqi}
.lb-row{display:flex;align-items:center;font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-weight:900;font-size:2.1cqi;letter-spacing:0.1cqi;padding:0.3cqi 0;line-height:1.2}
.lb-row .rank{width:2.7cqi;text-align:left;color:#000}
.lb-row .name{flex:1;color:#000;padding-left:1.15cqi;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .score{color:#000;text-align:right;min-width:9.2cqi}
.lb-row.empty .name,.lb-row.empty .score{color:#ccc}
.lb-row.you{background:#fff5cc;border-radius:0.58cqi}
.lb-row.you .name,.lb-row.you .rank,.lb-row.you .score{color:#9a6a00}
#go-restart{position:absolute;bottom:3.5%;left:0;right:0;font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-weight:900;color:#fff;-webkit-text-stroke:0.58cqi #000;text-align:center;font-size:4.2cqi;letter-spacing:0.38cqi}
#thumbs-popup{position:absolute;top:3%;left:50%;transform:translateX(-50%) scale(0);transition:transform 0.15s ease-out;pointer-events:none;z-index:5;font-size:17.3cqi;text-align:center;line-height:1;filter:drop-shadow(0.38cqi 0.38cqi 0 rgba(0,0,0,0.3));font-style:normal}
#thumbs-popup.show{transform:translateX(-50%) scale(1)}
#start-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:3.5%;pointer-events:all;z-index:15;font-style:italic}
#start-title{font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-weight:900;color:#fff;-webkit-text-stroke:0.77cqi #000;text-align:center;font-size:6.5cqi;line-height:0.95;letter-spacing:0.38cqi}
#start-subtitle{font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-weight:900;color:#fff;-webkit-text-stroke:0.39cqi #000;text-align:center;font-size:5cqi;line-height:1;letter-spacing:0.19cqi;margin-top:1.2cqi}
#name-input-wrap{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);width:75%;background:#fff;border:0.58cqi solid #000;border-radius:1.5cqi;padding:1.9cqi 2.7cqi;box-shadow:0.58cqi 0.58cqi 0 rgba(0,0,0,0.3);display:flex;flex-direction:column;gap:0.38cqi}
#name-prompt{font-family:Arial,Helvetica,sans-serif;font-style:italic;font-size:2.5cqi;color:#222;font-weight:600}
#name-input{width:100%;border:none;outline:none;background:transparent;font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-size:4.6cqi;color:#000;font-weight:900;letter-spacing:0.38cqi;text-transform:uppercase;padding:0.38cqi 0}
#name-input::placeholder{color:#bbb;font-weight:900;letter-spacing:0.38cqi;font-style:italic}
#start-bottom{position:absolute;bottom:3.5%;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 3%}
.legend{display:flex;align-items:center;gap:1.15cqi;font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-weight:900;color:#fff;-webkit-text-stroke:0.48cqi #000;font-size:5.2cqi;letter-spacing:0.38cqi}
.legend-emoji{font-size:6.9cqi;-webkit-text-stroke:0;filter:drop-shadow(0.19cqi 0.19cqi 0 rgba(0,0,0,0.4));font-style:normal}
.arrow-keys{font-family:'Arial Black',Arial,sans-serif;font-style:italic;font-weight:900;color:#fff;-webkit-text-stroke:0.38cqi #000;font-size:2.7cqi;letter-spacing:0.15cqi;text-align:center;line-height:1.1;display:flex;align-items:center;gap:1.15cqi}
.arrow-keys .arrow{font-size:5.2cqi;-webkit-text-stroke:0.48cqi #000}
</style>
<div class="page-wrap"><div class="game-sizer"><div id="gw">
<audio id="bg-music" src="audio/blue_slide_park.mp3" loop preload="auto"></audio>
<canvas id="c"></canvas>
<div id="ui">
<div id="score-box" style="display:none"><div id="score-label">SCORE:</div><div id="score-num">0</div></div>
<div id="player-name-display" style="display:none"></div>
<div id="thumbs-popup">👍🏻</div>
</div>
<button id="new-user-btn" style="display:none">NEW USER?</button>
<div id="start-screen">
<div id="start-title">BLUE SLIDE PARK</div>
<div id="start-subtitle">The Game</div>
<div id="name-input-wrap"><div id="name-prompt">Type your name and press ENTER to play</div><input id="name-input" type="text" maxlength="14" autofocus /></div>
<div id="start-bottom">
<div class="legend"><span class="legend-emoji">🍦</span><span>GOOD</span></div>
<div class="arrow-keys"><span class="arrow">←</span><span>ARROW KEYS<br>TO CONTROL</span><span class="arrow">→</span></div>
<div class="legend"><span>BAD</span><span class="legend-emoji">💩</span></div>
</div>
</div>
<div id="overlay" style="display:none"></div>
</div></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const LOGICAL_W=676,LOGICAL_H=400;
function resizeCanvas(){const gw=document.getElementById('gw'),dpr=window.devicePixelRatio||1,rect=gw.getBoundingClientRect();canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr)}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
const W=LOGICAL_W,H=LOGICAL_H;
const scoreNum=document.getElementById('score-num'),scoreBox=document.getElementById('score-box'),playerNameDisplay=document.getElementById('player-name-display'),overlay=document.getElementById('overlay'),thumbsPopup=document.getElementById('thumbs-popup'),startScreen=document.getElementById('start-screen'),nameInput=document.getElementById('name-input'),newUserBtn=document.getElementById('new-user-btn');
let keys={},state=null,playerName='',leaderboard=[];
function loadSavedName(){try{const v=localStorage.getItem('playerName');if(v)nameInput.value=v.toUpperCase()}catch(e){}}
function savePlayerName(n){try{localStorage.setItem('playerName',n)}catch(e){}}
async function loadLeaderboard(){try{const r=await fetch('/api/leaderboard');const data=await r.json();if(data&&Array.isArray(data.leaderboard))leaderboard=data.leaderboard}catch(e){leaderboard=[]}}
async function submitScoreToAPI(name,score){try{const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,score})});const data=await r.json();if(data&&Array.isArray(data.leaderboard))leaderboard=data.leaderboard;return data&&typeof data.rank==='number'?data.rank:-1}catch(e){return -1}}
function getBestScoreForUser(name){let best=0;for(const e of leaderboard)if(e.name===name&&e.score>best)best=e.score;return best}
function getTitleForScore(score){if(score<100)return'LOSER!';if(score<500)return'NOT BAD!';if(score<1000)return'UNDER THE WEATHER?';if(score<2000)return'DOPE!';if(score<5000)return'INCREDIBLY DOPE!';return'MOST DOPE!'}
loadSavedName();loadLeaderboard();
const bgMusic=document.getElementById('bg-music');bgMusic.volume=0.5;function startMusic(){bgMusic.play().catch(()=>{})}startMusic();function musicOnInteract(){startMusic();['click','keydown','touchstart'].forEach(ev=>document.removeEventListener(ev,musicOnInteract))}['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,musicOnInteract));
function lerp(a,b,t){return a+(b-a)*t}
const FOV=280,CAM_Y=-60,HORIZON_Y=H*0.50;
function project(x,y,z,camX){if(z<=1)z=1;return{sx:W/2+(x-camX)*FOV/z,sy:HORIZON_Y+((y-CAM_Y)*FOV)/z,scale:FOV/z}}
const R_SLIDE=350;function slideSurface(u,z,t){const R=R_SLIDE,d=175;return{x:u*R+t,y:d*Math.cos(u*Math.PI/2),z}}
function getTurnOffset(z,scroll,seed){const pos=scroll+z+seed;return Math.sin(pos*0.00015)*1230+Math.sin(pos*0.0005)*692+Math.sin(pos*0.00004)*1078+Math.cos(pos*0.00025)*846}
const PLAYER_Z=450,Z_FAR=20000,STEPS=200;
function drawSky(){let g=ctx.createLinearGradient(0,0,0,HORIZON_Y);g.addColorStop(0,'#6ec6f5');g.addColorStop(0.7,'#a8d8f0');g.addColorStop(1,'#f5c97a');ctx.fillStyle=g;ctx.fillRect(0,0,W,HORIZON_Y);ctx.beginPath();ctx.arc(W*0.62,HORIZON_Y-30,42,0,Math.PI*2);ctx.fillStyle='#f5d020';ctx.fill()}
function drawBridge(){ctx.save();const cx=195,baseY=HORIZON_Y,bridgeW=280,deckY=baseY-6,tC='#e8b020',tL='#f5d040';const ltX=cx-80,ltY=baseY-50;ctx.fillStyle=tC;ctx.fillRect(ltX-4,ltY,4,50);ctx.fillRect(ltX+4,ltY,4,50);ctx.fillRect(ltX-6,ltY-3,14,4);ctx.fillRect(ltX-4,ltY+20,12,3);ctx.fillStyle=tL;ctx.fillRect(ltX-4,ltY,1.5,50);ctx.fillRect(ltX+4,ltY,1.5,50);const rtX=cx+80,rtY=baseY-50;ctx.fillStyle=tC;ctx.fillRect(rtX-4,rtY,4,50);ctx.fillRect(rtX+4,rtY,4,50);ctx.fillRect(rtX-6,rtY-3,14,4);ctx.fillRect(rtX-4,rtY+20,12,3);ctx.fillStyle=tL;ctx.fillRect(rtX-4,rtY,1.5,50);ctx.fillRect(rtX+4,rtY,1.5,50);ctx.strokeStyle='#d8a010';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ltX,ltY-1);ctx.quadraticCurveTo(cx,deckY-2,rtX,rtY-1);ctx.stroke();ctx.beginPath();ctx.moveTo(ltX,ltY-1);ctx.quadraticCurveTo(ltX-30,ltY+18,cx-bridgeW/2+8,deckY);ctx.stroke();ctx.beginPath();ctx.moveTo(rtX,rtY-1);ctx.quadraticCurveTo(rtX+30,rtY+18,cx+bridgeW/2-8,deckY);ctx.stroke();ctx.strokeStyle='#e8b020';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(ltX,ltY);ctx.quadraticCurveTo(cx,deckY-1,rtX,rtY);ctx.stroke();ctx.beginPath();ctx.moveTo(ltX,ltY);ctx.quadraticCurveTo(ltX-30,ltY+19,cx-bridgeW/2+8,deckY+1);ctx.stroke();ctx.beginPath();ctx.moveTo(rtX,rtY);ctx.quadraticCurveTo(rtX+30,rtY+19,cx+bridgeW/2-8,deckY+1);ctx.stroke();ctx.strokeStyle='#d8a010';ctx.lineWidth=0.8;for(let i=1;i<12;i++){const t=i/12,x=ltX+(rtX-ltX)*t,cY=lerp(lerp(ltY-1,deckY-2,t),lerp(deckY-2,rtY-1,t),t);ctx.beginPath();ctx.moveTo(x,cY);ctx.lineTo(x,deckY);ctx.stroke()}for(let i=1;i<5;i++){const t=i/5,x=lerp(ltX,cx-bridgeW/2+8,t),cY=lerp(ltY-1,deckY,t*t*0.7+t*0.3);ctx.beginPath();ctx.moveTo(x,cY);ctx.lineTo(x,deckY);ctx.stroke()}for(let i=1;i<5;i++){const t=i/5,x=lerp(rtX,cx+bridgeW/2-8,t),cY=lerp(rtY-1,deckY,t*t*0.7+t*0.3);ctx.beginPath();ctx.moveTo(x,cY);ctx.lineTo(x,deckY);ctx.stroke()}ctx.fillStyle='#b88010';ctx.fillRect(cx-bridgeW/2,deckY,bridgeW,5);ctx.fillStyle='#e8b020';ctx.fillRect(cx-bridgeW/2,deckY,bridgeW,2);ctx.fillStyle='#8a5a08';ctx.fillRect(cx-bridgeW/2,deckY+4,bridgeW,1);ctx.fillStyle='#888';ctx.fillRect(ltX-3,deckY+5,12,4);ctx.fillRect(rtX-3,deckY+5,12,4);ctx.restore()}
function drawCity(){const b=[{x:0.72,w:0.05,h:0.20},{x:0.78,w:0.03,h:0.12},{x:0.83,w:0.06,h:0.16},{x:0.90,w:0.04,h:0.22},{x:0.02,w:0.04,h:0.10},{x:0.07,w:0.03,h:0.08}];ctx.fillStyle='#9ab0be';for(const i of b)ctx.fillRect(i.x*W,HORIZON_Y-i.h*H,i.w*W,i.h*H+2)}
function drawTrees(){const tr=[{x:-0.06,y:0.34,r:32},{x:-0.45,y:0.42,r:38},{x:0.50,y:0.36,r:28},{x:0.06,y:0.40,r:34}];for(const t of tr){const tx=t.x*W+W*0.5,ty=t.y*H;ctx.fillStyle='#7a5c3a';ctx.fillRect(tx-4,ty,8,18);ctx.beginPath();ctx.arc(tx,ty,t.r,0,Math.PI*2);ctx.fillStyle='#4caf50';ctx.fill();ctx.beginPath();ctx.arc(tx-t.r*0.3,ty-t.r*0.2,t.r*0.7,0,Math.PI*2);ctx.fillStyle='#66bb6a';ctx.fill()}}
function drawGround(){ctx.fillStyle='#5cb85c';ctx.fillRect(0,HORIZON_Y,W,H-HORIZON_Y);ctx.fillStyle='#6dca6d';ctx.beginPath();ctx.moveTo(0,HORIZON_Y);ctx.quadraticCurveTo(W*0.15,HORIZON_Y-20,W*0.30,HORIZON_Y);ctx.lineTo(0,HORIZON_Y);ctx.fill();ctx.beginPath();ctx.moveTo(W,HORIZON_Y);ctx.quadraticCurveTo(W*0.85,HORIZON_Y-20,W*0.70,HORIZON_Y);ctx.lineTo(W,HORIZON_Y);ctx.fill()}
function drawHalfpipe(s){const zN=60,zF=Z_FAR,st=STEPS,uS=10;for(let i=st-1;i>=0;i--){const z1=zN+(zF-zN)*(i/st),z2=zN+(zF-zN)*((i+1)/st),t1=getTurnOffset(z1,s.scroll,s.courseSeed),t2=getTurnOffset(z2,s.scroll,s.courseSeed),dT=1-(z1-zN)/(zF-zN);let bR=lerp(10,65,dT),bG=lerp(55,145,dT),bB=lerp(120,215,dT);for(let j=0;j<uS;j++){const u1=-1+2*(j/uS),u2=-1+2*((j+1)/uS),um=(u1+u2)/2,shade=Math.pow(Math.cos(um*Math.PI/2),1.35),r=Math.round(lerp(bR+24,bR*0.42,shade)),g=Math.round(lerp(bG+24,bG*0.48,shade)),b=Math.round(lerp(bB+20,bB*0.62,shade));ctx.beginPath();const p1a=project(slideSurface(u1,z1,t1).x,slideSurface(u1,z1,t1).y,z1,s.camX),p1b=project(slideSurface(u2,z1,t1).x,slideSurface(u2,z1,t1).y,z1,s.camX),p2b=project(slideSurface(u2,z2,t2).x,slideSurface(u2,z2,t2).y,z2,s.camX),p2a=project(slideSurface(u1,z2,t2).x,slideSurface(u1,z2,t2).y,z2,s.camX);ctx.moveTo(p1a.sx,p1a.sy);ctx.lineTo(p1b.sx,p1b.sy);ctx.lineTo(p2b.sx,p2b.sy);ctx.lineTo(p2a.sx,p2a.sy);ctx.closePath();ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fill()}}ctx.strokeStyle='#5aa3d0';ctx.lineWidth=2;const sS=400;for(let zw=Math.floor(s.scroll/sS)*sS;zw<s.scroll+zF;zw+=sS){const relZ=zw-s.scroll;if(relZ<zN||relZ>zF)continue;const t=getTurnOffset(relZ,s.scroll,s.courseSeed);ctx.beginPath();for(let j=0;j<=16;j++){const u=-0.95+1.9*(j/16),pt=slideSurface(u,relZ,t),p=project(pt.x,pt.y,pt.z,s.camX);if(j===0)ctx.moveTo(p.sx,p.sy);else ctx.lineTo(p.sx,p.sy)}ctx.stroke()}}
function drawSlideEdges(s){const zN=60,zF=Z_FAR,st=STEPS;for(let sd of[-1,1]){ctx.beginPath();for(let i=0;i<=st;i++){const z=zN+(zF-zN)*(i/st),t=getTurnOffset(z,s.scroll,s.courseSeed),pt=slideSurface(sd,z,t),p=project(pt.x,pt.y,pt.z,s.camX);if(i===0)ctx.moveTo(p.sx,p.sy);else ctx.lineTo(p.sx,p.sy)}ctx.strokeStyle='#0d3a60';ctx.lineWidth=5;ctx.stroke()}}
function drawCharacter(s){const t=getTurnOffset(PLAYER_Z,s.scroll,s.courseSeed),ps=slideSurface(s.player.u,PLAYER_Z,t),pp=project(ps.x,ps.y,ps.z,s.camX),x=pp.sx,y=pp.sy-14,sc=1.25,tl=-s.player.u*0.5+s.player.vu*0.6;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.rotate(tl);ctx.beginPath();ctx.ellipse(0,16,22,5,0,0,Math.PI*2);ctx.fillStyle='#0d3a60';ctx.fill();ctx.fillStyle='#f0f0f0';ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-13,-4);ctx.quadraticCurveTo(-24,0,-28,10);ctx.lineTo(-23,13);ctx.quadraticCurveTo(-19,8,-11,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(13,-4);ctx.quadraticCurveTo(24,0,28,10);ctx.lineTo(23,13);ctx.quadraticCurveTo(19,8,11,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#f5c5a0';ctx.beginPath();ctx.arc(-26,12,4,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(26,12,4,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#f0f0f0';ctx.beginPath();ctx.moveTo(-13,-10);ctx.quadraticCurveTo(-15,6,-12,16);ctx.lineTo(12,16);ctx.quadraticCurveTo(15,6,13,-10);ctx.closePath();ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='#4488cc';const st=[{y:-7,w:13},{y:-1,w:13.5},{y:5,w:14},{y:11,w:14.5}];for(const i of st)ctx.fillRect(-i.w,i.y,i.w*2,3);ctx.fillStyle='#d0d0d0';ctx.beginPath();ctx.moveTo(10,-9);ctx.quadraticCurveTo(13,6,11,15);ctx.lineTo(12,16);ctx.quadraticCurveTo(15,6,13,-10);ctx.closePath();ctx.fill();ctx.fillStyle='#f5c5a0';ctx.fillRect(-4,-13,8,5);ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.strokeRect(-4,-13,8,5);ctx.fillStyle='#f5c5a0';ctx.beginPath();ctx.ellipse(0,-22,11,13,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#e0a880';ctx.beginPath();ctx.ellipse(6,-22,5,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,-25,16,5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(0,-23,14,2.5,0,0,Math.PI);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.moveTo(-12,-27);ctx.quadraticCurveTo(-13,-38,-6,-41);ctx.quadraticCurveTo(0,-43,6,-41);ctx.quadraticCurveTo(13,-38,12,-27);ctx.closePath();ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.stroke();ctx.strokeStyle='#222';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(0,-27);ctx.lineTo(0,-42);ctx.stroke();ctx.beginPath();ctx.moveTo(-6,-27);ctx.quadraticCurveTo(-7,-36,-3,-42);ctx.stroke();ctx.beginPath();ctx.moveTo(6,-27);ctx.quadraticCurveTo(7,-36,3,-42);ctx.stroke();ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.moveTo(4,-27);ctx.quadraticCurveTo(13,-38,12,-27);ctx.closePath();ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,-42,1.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.lineWidth=0.5;ctx.stroke();ctx.fillStyle='#f5d020';ctx.font='bold 11px Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('P',0,-34);ctx.restore()}
function drawObject(s,o){if(o.collected)return;const relZ=o.worldZ-s.scroll;const t=getTurnOffset(relZ,s.scroll,s.courseSeed),sf=slideSurface(o.u,relZ,t),p=project(sf.x,sf.y-60,relZ,s.camX);if(p.scale<0.05)return;ctx.save();ctx.translate(p.sx,p.sy);const sz=p.scale*96;if(o.type==='icecream')drawIceCream(0,0,sz);else drawPoop(0,0,sz);ctx.restore()}
function drawIceCream(x,y,sz){const s=sz/40;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#d4a356';ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(0,20);ctx.lineTo(10,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke();ctx.strokeStyle='#8a6a30';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-7,4);ctx.lineTo(-2,14);ctx.moveTo(-3,4);ctx.lineTo(2,14);ctx.moveTo(2,4);ctx.lineTo(7,14);ctx.moveTo(-9,4);ctx.lineTo(9,4);ctx.moveTo(-7,9);ctx.lineTo(7,9);ctx.moveTo(-5,14);ctx.lineTo(5,14);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-11,0);ctx.quadraticCurveTo(-13,-4,-10,-7);ctx.quadraticCurveTo(-6,-10,0,-10);ctx.quadraticCurveTo(6,-10,10,-7);ctx.quadraticCurveTo(13,-4,11,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-9,-6);ctx.quadraticCurveTo(-11,-10,-8,-13);ctx.quadraticCurveTo(-4,-16,0,-16);ctx.quadraticCurveTo(4,-16,8,-13);ctx.quadraticCurveTo(11,-10,9,-6);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-7,-12);ctx.quadraticCurveTo(-8,-16,-5,-19);ctx.quadraticCurveTo(-2,-21,0,-23);ctx.quadraticCurveTo(2,-21,5,-19);ctx.quadraticCurveTo(8,-16,7,-12);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function drawPoop(x,y,sz){const s=sz/40;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#6b3a18';ctx.beginPath();ctx.ellipse(0,10,14,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7d4520';ctx.beginPath();ctx.ellipse(0,2,11,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b5028';ctx.beginPath();ctx.ellipse(0,-6,7,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8b5028';ctx.beginPath();ctx.moveTo(-4,-8);ctx.quadraticCurveTo(0,-16,4,-8);ctx.closePath();ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(0,10,14,7,0,Math.PI*3/2+Math.PI/4,Math.PI*3/2-Math.PI/4+Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,2,11,6,0,Math.PI*3/2+Math.PI/6,Math.PI*3/2-Math.PI/6+Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(0,-6,7,5,0,0,Math.PI*2);ctx.stroke();ctx.restore()}
function showThumbs(){thumbsPopup.classList.add('show');clearTimeout(showThumbs._t);showThumbs._t=setTimeout(()=>{thumbsPopup.classList.remove('show')},700)}
function initState(){return{player:{u:0,vu:0},objects:[],scroll:0,scrollSpeed:30,score:0,frameCount:0,spawnTimer:0,running:false,dead:false,courseSeed:Math.random()*10000,camX:0}}
function spawnObj(s){const u=(Math.random()*2-1)*0.7;s.objects.push({u,worldZ:s.scroll+6000,type:Math.random()<0.5?'icecream':'poop',collected:false})}
function update(s){if(!s.running)return;s.frameCount++;s.scroll+=s.scrollSpeed;const level=Math.floor(s.frameCount/600);s.scrollSpeed=30+level*5;const slideCenter=getTurnOffset(PLAYER_Z,s.scroll,s.courseSeed);s.camX+=(slideCenter-s.camX)*0.08;const accel=0.021,friction=0.85,maxV=0.0252,gravity=0.0015;const turnAhead=getTurnOffset(PLAYER_Z+50,s.scroll,s.courseSeed);const turnBehind=getTurnOffset(PLAYER_Z-50,s.scroll,s.courseSeed);const turnRate=(turnAhead-turnBehind)/100;const centripetal=turnRate*0.0015;if(keys['ArrowLeft'])s.player.vu-=accel;if(keys['ArrowRight'])s.player.vu+=accel;s.player.vu+=-s.player.u*gravity;s.player.vu+=centripetal;s.player.vu*=friction;s.player.vu=Math.max(-maxV,Math.min(maxV,s.player.vu));s.player.u+=s.player.vu;if(Math.abs(s.player.u)>0.95){s.running=false;s.dead=true;showGameOver(s.score);return}s.spawnTimer++;const rate=Math.max(40,90-level*6);if(s.spawnTimer>=rate){spawnObj(s);s.spawnTimer=0}for(const o of s.objects){const relZ=o.worldZ-s.scroll;if(!o.collected&&relZ>PLAYER_Z-40&&relZ<PLAYER_Z+40){const du=o.u-s.player.u;if(Math.abs(du)<0.25){o.collected=true;if(o.type==='icecream'){s.score+=100;showThumbs()}else{s.running=false;s.dead=true;showGameOver(s.score);return}}}}s.objects=s.objects.filter(o=>o.worldZ-s.scroll>60);s.score+=0.1;scoreNum.textContent=Math.floor(s.score)}
function buildSlideClipPath(s){const zN=60,zF=Z_FAR,st=STEPS;ctx.beginPath();for(let i=0;i<=st;i++){const z=zN+(zF-zN)*(i/st),t=getTurnOffset(z,s.scroll,s.courseSeed),pt=slideSurface(-1,z,t),p=project(pt.x,pt.y,pt.z,s.camX);if(i===0)ctx.moveTo(p.sx,p.sy);else ctx.lineTo(p.sx,p.sy)}for(let i=st;i>=0;i--){const z=zN+(zF-zN)*(i/st),t=getTurnOffset(z,s.scroll,s.courseSeed),pt=slideSurface(1,z,t),p=project(pt.x,pt.y,pt.z,s.camX);ctx.lineTo(p.sx,p.sy)}ctx.closePath()}
function render(s){ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);ctx.clearRect(0,0,W,H);drawSky();drawCity();drawBridge();drawGround();drawTrees();drawHalfpipe(s);const sorted=[...s.objects].sort((a,b)=>(b.worldZ-s.scroll)-(a.worldZ-s.scroll));const occluded=[],clear=[];for(const o of sorted){const objRelZ=o.worldZ-s.scroll;const objT=getTurnOffset(objRelZ,s.scroll,s.courseSeed);const objSf=slideSurface(o.u,objRelZ,objT);const objP=project(objSf.x,objSf.y,objRelZ,s.camX);let blocked=false;const zStep=Math.max(20,objRelZ/40);for(let cz=60;cz<objRelZ-zStep;cz+=zStep){const ct=getTurnOffset(cz,s.scroll,s.courseSeed);const cLeft=project(slideSurface(-1,cz,ct).x,slideSurface(-1,cz,ct).y,cz,s.camX);const cRight=project(slideSurface(1,cz,ct).x,slideSurface(1,cz,ct).y,cz,s.camX);if(objP.sx<cLeft.sx||objP.sx>cRight.sx){blocked=true;break}}if(blocked)occluded.push(o);else clear.push(o)}ctx.save();buildSlideClipPath(s);ctx.clip();for(const o of occluded)drawObject(s,o);ctx.restore();drawSlideEdges(s);for(const o of clear)drawObject(s,o);drawCharacter(s)}
function loop(){update(state);render(state);requestAnimationFrame(loop)}
function buildLeaderboardHTML(myIdx){const N=7;let r='';for(let i=0;i<N;i++){const e=leaderboard[i];if(e){const y=i===myIdx;r+=`<div class="lb-row ${y?'you':''}"><span class="rank">${i+1}</span><span class="name">${escapeHtml(e.name)}</span><span class="score">${e.score}</span></div>`}else{r+=`<div class="lb-row empty"><span class="rank">${i+1}</span><span class="name">—</span><span class="score">—</span></div>`}}return r}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function showGameOver(score){const fs=Math.floor(score);const title=getTitleForScore(fs);const longClass=title.length>10?'long':'';overlay.innerHTML=`<div id="go-title" class="${longClass}">${title}</div><div id="go-score"><div class="label">SCORE:</div><div class="num">${fs}</div><div class="best">BEST SCORE:</div><div class="best-num">...</div></div><div id="leaderboard"><div id="leaderboard-title">LEADERBOARD</div>${buildLeaderboardHTML(-1)}</div><div id="go-restart">PRESS SPACE TO RESTART</div>`;overlay.style.display='block';newUserBtn.style.display='block';scoreBox.style.display='none';const myIdx=await submitScoreToAPI(playerName||'PLAYER',fs);const bs=getBestScoreForUser(playerName||'PLAYER');overlay.innerHTML=`<div id="go-title" class="${longClass}">${title}</div><div id="go-score"><div class="label">SCORE:</div><div class="num">${fs}</div><div class="best">BEST SCORE:</div><div class="best-num">${bs}</div></div><div id="leaderboard"><div id="leaderboard-title">LEADERBOARD</div>${buildLeaderboardHTML(myIdx)}</div><div id="go-restart">PRESS SPACE TO RESTART</div>`}
function startGame(){state=initState();state.running=true;overlay.style.display='none';startScreen.style.display='none';scoreBox.style.display='block';playerNameDisplay.style.display='block';playerNameDisplay.textContent='CURRENT USER: '+playerName.toUpperCase();newUserBtn.style.display='none';scoreNum.textContent='0'}
function goToStartScreen(){state=initState();playerName='';nameInput.value='';startScreen.style.display='flex';overlay.style.display='none';scoreBox.style.display='none';playerNameDisplay.style.display='none';newUserBtn.style.display='none';setTimeout(()=>nameInput.focus(),50)}
newUserBtn.addEventListener('click',goToStartScreen);
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){const n=nameInput.value.trim().toUpperCase();if(n.length>0){playerName=n;savePlayerName(n);startGame()}else{nameInput.style.borderColor='#e24b4a';setTimeout(()=>{nameInput.style.borderColor=''},1500)}e.stopPropagation()}});
setTimeout(()=>nameInput.focus(),100);
document.addEventListener('keydown',e=>{if(document.activeElement===nameInput)return;keys[e.key]=true;if(e.key===' '){e.preventDefault();if((!state||!state.running)&&playerName)startGame()}if(e.key==='ArrowLeft'||e.key==='ArrowRight')e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key]=false});
state=initState();loop();
</script>
